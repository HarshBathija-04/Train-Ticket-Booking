name: Keep alive

# Render free web services sleep after 15 idle minutes; /health also runs SELECT 1 on the DB.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::notice::BACKEND_URL repository variable is not set, skipping keep-alive ping"
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "${BACKEND_URL%/}/health"
